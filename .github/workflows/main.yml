name: Build iOS App (.ipa)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    name: Build iOS (.ipa) on Cloud macOS
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare Web Directory
        run: |
          mkdir -p www
          cp -f index.html style.css app.js www/ 2>/dev/null || true
          cp -f app-logo.png icon-192.png icon-512.png www/ 2>/dev/null || true
          ls -la www

      - name: Install NPM Dependencies
        run: npm install

      - name: Generate Clean iOS Native Project
        run: |
          rm -rf ios
          npx cap add ios
          npx cap sync ios

      - name: Compile iOS App with Xcode
        run: |
          cd ios/App
          xcodebuild build \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package into IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find ios/App/build -name "*.app" -type d | head -n 1)
          echo "Found compiled app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r MyBook_iOS.ipa Payload/
          mv MyBook_iOS.ipa "$GITHUB_WORKSPACE/MyBook_iOS.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyBook-iOS-App
          path: MyBook_iOS.ipa
          retention-days: 14
